name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install dependencies
        working-directory: ./flutter_project
        run: flutter pub get

      - name: Build Android APK (Release)
        working-directory: ./flutter_project
        run: flutter build apk --release --split-per-abi=false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RewardRandomizer-Release-APK
          path: flutter_project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          files: flutter_project/build/app/outputs/flutter-apk/app-release.apk
          name: Reward Randomizer APK Release
          tag_name: v1.0.0
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
